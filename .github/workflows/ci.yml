name: CI

on:
  push:
  pull_request:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: Linux
          - os: windows-latest
            name: Windows
          - os: macos-latest
            name: macOS

    runs-on: ${{ matrix.os }}
    name: ${{ matrix.name }}

    steps:
      - uses: actions/checkout@v5

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libfltk1.3-dev zlib1g-dev portaudio19-dev \
            libx11-dev libxext-dev libxft-dev libxinerama-dev \
            libxcursor-dev libxrender-dev libxfixes-dev \
            libpango1.0-dev libgl1-mesa-dev libglu1-mesa-dev

      - name: Cache FetchContent
        if: runner.os != 'Linux'
        uses: actions/cache@v5
        with:
          path: ${{ github.workspace }}/.fetchcontent
          key: fetchcontent-${{ runner.os }}-${{ hashFiles('CMakeLists.txt') }}
          restore-keys: fetchcontent-${{ runner.os }}-

      - name: Configure
        run: >
          cmake -B build -DCMAKE_BUILD_TYPE=Release -Wno-dev
          ${{ runner.os != 'Linux' && format('-DFETCHCONTENT_BASE_DIR={0}/.fetchcontent', github.workspace) || '' }}

      - name: Build
        run: cmake --build build --config Release

      - name: Upload artifacts
        uses: actions/upload-artifact@v6
        with:
          name: dreamulator-${{ matrix.name }}
          path: |
            build/dreamulator*
            build/dreamprint*
            build/Release/dreamulator*
            build/Release/dreamprint*
